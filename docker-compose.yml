version: "3.9"

services:
  # ─── PostgreSQL Database ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: alp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_learning}
      POSTGRES_USER: ${POSTGRES_USER:-alp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alp_user} -d ${POSTGRES_DB:-adaptive_learning}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alp_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alp_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-adaptive_learning}
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./rag:/app/rag
      - ./data:/app/data
      - ./ml:/app/ml
      - ./knowledge_graph:/app/knowledge_graph
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Frontend (Vite + React) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alp_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:

networks:
  default:
    name: alp_network
